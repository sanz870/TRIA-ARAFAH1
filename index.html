<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRIA ARAFAH</title>


    <!-- =================================
         GOOGLE FONT
    ================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =================================
         CSS
    ================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================
         HEADER
    ================================== -->

    <header class="header">

        <div class="logo">
            TRIA ARAFAH
        </div>


        <button
            class="menu-button"
            aria-label="Buka menu"
        >
            ☰
        </button>

    </header>



    <!-- =================================
         MUSIK
    ================================== -->

    <audio
    id="backgroundMusic"
    controls
    loop
>
    <source
        src="./Sekian, Terima Kasih.mp3"
        type="audio/mpeg"
    >

    Browser kamu tidak mendukung audio.
</audio>

    <!-- =================================
         TOMBOL MUSIK
    ================================== -->

    <button
        class="music-button"
        id="musicButton"
        aria-label="Putar musik"
    >
        ♫
    </button>



    <!-- =================================
         MAIN
    ================================== -->

    <main>


        <!-- =================================
             HERO
        ================================== -->

        <section
            id="home"
            class="hero"
        >

            <div class="hero-content">


                <span class="hero-small">
                    ini
                </span>


                <h1>
                    TRIA
                    <br>
                    ARAFAH
                </h1>


                <p class="hero-description">
                    jare bapak mbek mamak.
                    aku seng paling cantik
                    aamiin masyaallah
                </p>


                <a
                    href="#gallery"
                    class="hero-button"
                >
                    Lihat Galeri
                </a>


            </div>

        </section>



        <!-- =================================
             ABOUT
        ================================== -->

        <section
            id="about"
            class="about"
        >

            <div class="section-title">

                <span>
                    ABOUT
                </span>


                <h2>
                    Tria Arafah
                </h2>

            </div>


            <div class="about-content">

                <p>
                    nyenyenyenye
                </p>

            </div>

        </section>



        <!-- =================================
             GALLERY
        ================================== -->

        <section
            id="gallery"
            class="gallery"
        >

            <div class="section-title">

                <span>
                    MEMORIES
                </span>


                <h2>
                    Galeri
                </h2>

            </div>


            <!-- =================================
                 3 FOTO
            ================================== -->

            <div class="photo-container">


                <!-- FOTO 1 -->

                <div class="photo-card">

                    <img
                        src="IMG_1005.JPG.jpg"
                        alt="Tria Arafah"
                    >

                </div>


                <!-- FOTO 2 -->

                <div class="photo-card">

                    <img
                        src="IMG_1011.JPG.jpg"
                        alt="Tria Arafah"
                    >

                </div>


                <!-- FOTO 3 -->

                <div class="photo-card">

                    <img
                        src="IMG_1013.JPG.jpg"
                        alt="Tria Arafah"
                    >

                </div>


            </div>

        </section>



        <!-- =================================
             CONTACT
        ================================== -->

        <section
            id="contact"
            class="contact"
        >

            <div class="section-title">

                <span>
                    MASYAALLAH
                </span>


                <h2>
                    LEBIH MANIS
                    <br>
                    DARI GULA
                </h2>

            </div>


            <p>
                CANTIK? OHH JELASSSS
            </p>

        </section>


    </main>



    <!-- =================================
         FOOTER
    ================================== -->

    <footer class="footer">

        <p>
            © 2026 TRIA ARAFAH
        </p>

    </footer>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="script.js"></script>


</body>

</html>
